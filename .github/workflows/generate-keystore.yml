name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'اكتب كلمة سر لمفتاح التوقيع (احفظها جيداً)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore & Base64
        run: |
          keytool -genkey -v -keystore silvercoupons-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias silvercoupons \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=Silver Coupons, OU=App, O=Silver Coupons, L=Cairo, S=Cairo, C=EG"
          base64 -w 0 silvercoupons-release.jks > keystore_base64.txt

      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: SilverCoupons-Keystore-KEEP-SAFE
          path: |
            silvercoupons-release.jks
            keystore_base64.txt

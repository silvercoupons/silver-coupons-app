name: Build Signed AAB & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Generate App Icons
        run: |
          mkdir -p www assets
          npm install --legacy-peer-deps
          CAP_VER=$(node -p "require('./node_modules/@capacitor/core/package.json').version.split('.')[0]")
          npm install @capacitor/share@^${CAP_VER}.0.0 --legacy-peer-deps
          npm install onesignal-cordova-plugin --legacy-peer-deps
          npm install -D @capacitor/assets --legacy-peer-deps
          npx cap add android
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          sed -i 's/google-services:4.4.0/google-services:4.4.2/g' android/build.gradle
          sed -i 's/versionCode 1/versionCode 2/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.1"/g' android/app/build.gradle
          if [ -f "www/logo.png" ]; then
            cp www/logo.png assets/icon.png
            cp www/logo.png assets/icon-only.png
            cp www/logo.png assets/icon-foreground.png
            cp www/logo.png assets/splash.png
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff'
          fi
          npx cap sync android

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/silvercoupons-release.jks

      - name: Build Signed Release AAB & APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/silvercoupons-release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="silvercoupons" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}"
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/SilverCoupons.aab"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/SilverCoupons.apk"

      - name: Upload AAB & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SilverCoupons-Release-Files
          path: |
            android/app/build/outputs/bundle/release/SilverCoupons.aab
            android/app/build/outputs/apk/release/SilverCoupons.apk

      - name: Publish Release Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Silver Coupons App (Release AAB & APK)"
          files: |
            android/app/build/outputs/bundle/release/SilverCoupons.aab
            android/app/build/outputs/apk/release/SilverCoupons.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

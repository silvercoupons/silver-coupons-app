name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Generate App Icons
        run: |
          mkdir -p www assets
          npm install
          npm install -D @capacitor/assets
          npx cap add android
          if [ -f "www/logo.png" ]; then
            cp www/logo.png assets/icon.png
            cp www/logo.png assets/icon-only.png
            cp www/logo.png assets/icon-foreground.png
            cp www/logo.png assets/splash.png
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff'
          fi
          npx cap sync android

      - name: Inject Start.io Ad SDK
        env:
          STARTIO_APP_ID: "210311194"
        run: |
          node -e '
            const fs = require("fs");
            const appId = process.env.STARTIO_APP_ID;
            let gradle = fs.readFileSync("android/app/build.gradle", "utf8");
            gradle = gradle.replace("dependencies {", "repositories { mavenCentral() }\ndependencies {\n    implementation \"com.startapp:inapp-sdk:5.0.2\"");
            fs.writeFileSync("android/app/build.gradle", gradle);
            let manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
            manifest = manifest.replace("<application", "<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n    <application");
            manifest = manifest.replace("</application>", `        <meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="${appId}" />\n    </application>`);
            fs.writeFileSync("android/app/src/main/AndroidManifest.xml", manifest);
          '
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          PKG_LINE=$(head -n 1 "$MAIN_ACT")
          printf '%s\n\nimport android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;\nimport com.startapp.sdk.adsbase.StartAppSDK;\nimport com.startapp.sdk.adsbase.StartAppAd;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        StartAppSDK.init(this, "%s", true);\n        StartAppAd.showAd(this);\n    }\n}\n' "$PKG_LINE" "$STARTIO_APP_ID" > "$MAIN_ACT"

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/SilverCoupons.apk"

      - name: Upload APK Ready for Download
        uses: actions/upload-artifact@v4
        with:
          name: SilverCoupons-APK
          path: "android/app/build/outputs/apk/debug/SilverCoupons.apk"

      - name: Publish Direct APK Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Silver Coupons App (APK)"
          files: "android/app/build/outputs/apk/debug/SilverCoupons.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Generate App Icons
        run: |
          mkdir -p www assets
          npm install
          npm install -D @capacitor/assets
          npx cap add android
          if [ -f "www/logo.png" ]; then
            cp www/logo.png assets/icon.png
            cp www/logo.png assets/icon-only.png
            cp www/logo.png assets/icon-foreground.png
            cp www/logo.png assets/splash.png
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff'
          fi
          npx cap sync android

      - name: Inject Start.io Ad SDK
        env:
          STARTIO_APP_ID: "210311194"
        run: |
          # 1. إضافة مكتبة Start.io إلى ملف build.gradle
          sed -i "/dependencies {/a \    implementation 'com.startapp:inapp-sdk:5.1.0'" android/app/build.gradle

          # 2. إضافة تصاريح الإعلانات ومعرّف التطبيق في AndroidManifest.xml
          sed -i "/<application/i \    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />" android/app/src/main/AndroidManifest.xml
          sed -i "/<\/application>/i \        <meta-data android:name=\"com.startapp.sdk.APPLICATION_ID\" android:value=\"${STARTIO_APP_ID}\" />" android/app/src/main/AndroidManifest.xml

          # 3. تهيئة الإعلانات وتفعيل الإعلان الترحيبي والبانر داخل MainActivity.java
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          sed -i "/import com.getcapacitor.BridgeActivity;/a import android.os.Bundle;\nimport com.startapp.sdk.adsbase.StartAppSDK;\nimport com.startapp.sdk.adsbase.StartAppAd;" "$MAIN_ACT"
          sed -i "/public class MainActivity extends BridgeActivity {/a \    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        StartAppSDK.init(this, \"${STARTIO_APP_ID}\", true);\n        StartAppAd.showAd(this);\n    }" "$MAIN_ACT"

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/SilverCoupons.apk"

      - name: Upload APK Ready for Download
        uses: actions/upload-artifact@v4
        with:
          name: SilverCoupons-APK
          path: "android/app/build/outputs/apk/debug/SilverCoupons.apk"

      - name: Publish Direct APK Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Silver Coupons App (APK)"
          files: "android/app/build/outputs/apk/debug/SilverCoupons.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

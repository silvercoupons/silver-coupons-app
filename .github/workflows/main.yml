name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Generate App Icons
        run: |
          mkdir -p www assets
          npm install
          npm install -D @capacitor/assets
          npx cap add android
          if [ -f "www/logo.png" ]; then
            cp www/logo.png assets/icon.png
            cp www/logo.png assets/icon-only.png
            cp www/logo.png assets/icon-foreground.png
            cp www/logo.png assets/splash.png
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff'
          fi
          npx cap sync android

      - name: Inject Start.io Ad SDK Safely
        env:
          STARTIO_APP_ID: "YOUR_STARTIO_APP_ID"
        run: |
          python3 - << 'EOF'
          import os, glob

          app_id = os.environ["STARTIO_APP_ID"]

          # 1. إضافة مكتبة Start.io إلى build.gradle
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              gradle = f.read()
          if "com.startapp:inapp-sdk" not in gradle:
              gradle = gradle.replace("dependencies {", "dependencies {\n    implementation 'com.startapp:inapp-sdk:5.0.2'", 1)
          with open(gradle_path, "w") as f:
              f.write(gradle)

          # 2. إضافة التصاريح ومعرف التطبيق في AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()
          if "ACCESS_NETWORK_STATE" not in manifest:
              manifest = manifest.replace("<application", '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          if "com.startapp.sdk.APPLICATION_ID" not in manifest:
              manifest = manifest.replace("</application>", f'        <meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="{app_id}" />\n    </application>', 1)
          with open(manifest_path, "w") as f:
              f.write(manifest)

          # 3. كتابة MainActivity.java النظيف لتفعيل الإعلان البيني فقط بدون بانر سفلي
          main_files = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
          if main_files:
              main_path = main_files[0]
              with open(main_path, "r") as f:
                  first_line = f.readline().strip()
              pkg_line = first_line if first_line.startswith("package ") else "package com.silvercoupons.app;"
              java_code = f"""{pkg_line}

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.startapp.sdk.adsbase.StartAppSDK;
          import com.startapp.sdk.adsbase.StartAppAd;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  StartAppSDK.init(this, "{app_id}", true);
                  StartAppAd.showAd(this);
              }}
          }}
          """
              with open(main_path, "w") as f:
                  f.write(java_code)
          EOF

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/SilverCoupons.apk"

      - name: Upload APK Ready for Download
        uses: actions/upload-artifact@v4
        with:
          name: SilverCoupons-APK
          path: "android/app/build/outputs/apk/debug/SilverCoupons.apk"

      - name: Publish Direct APK Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Silver Coupons App (APK)"
          files: "android/app/build/outputs/apk/debug/SilverCoupons.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

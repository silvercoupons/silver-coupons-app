name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Add Android Platform
        run: |
          npm install
          npx cap add android
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">الكوبون الفضي<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">الكوبون الفضي<\/string>/g' android/app/src/main/res/values/strings.xml
          npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/الكوبون الفضي.apk"

      - name: Upload APK Ready for Download
        uses: actions/upload-artifact@v4
        with:
          name: الكوبون-الفضي-APK
          path: "android/app/build/outputs/apk/debug/الكوبون الفضي.apk"
